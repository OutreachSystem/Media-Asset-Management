services:
  api:
    build: ./apps/api
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      JWT_SECRET: lumina-demo-secret
      CORS_ORIGIN: http://localhost:8080
    volumes:
      - api-data:/app/data

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  api-data:
